<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pi-Proxy</title>
    <style>
      :root {
        --bg: #07111d;
        --panel: #182a44;
        --panel-alt: #142949;
        --primary: #44baf5;
        --primary-dark: #1177c0;
        --text: #eaf6ff;
        --muted: #a8c1d9;
        --success: #66d9a8;
        --error: #ff7d7d;
        --border: rgba(255, 255, 255, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(180deg, #07111d 0%, #0d1b2b 100%);
        color: var(--text);
        min-height: 100vh;
        padding: 32px 18px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      .panel {
        background: rgba(17, 29, 47, 0.96);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.2);
      }

      h1 {
        margin-top: 0;
        font-size: clamp(2rem, 3vw, 2.8rem);
      }

      h2 {
        margin-bottom: 12px;
      }

      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }

      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 10px 16px;
        font-size: 0.96rem;
        font-weight: 700;
        background: var(--primary);
        color: #07111d;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      button.secondary {
        background: #1a2e46;
        color: var(--text);
      }

      .status {
        background: rgba(80, 196, 255, 0.08);
        border: 1px solid rgba(80, 196, 255, 0.18);
        border-radius: 12px;
        padding: 16px;
        margin: 18px 0;
        line-height: 1.6;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(220px, 1fr));
        gap: 18px;
        margin: 22px 0;
      }

      .stat-card {
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
      }

      .stat-label {
        color: var(--muted);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08rem;
      }

      .stat-value {
        margin-top: 8px;
        font-weight: 700;
        font-size: clamp(1.8rem, 2.2vw, 2.5rem);
      }

      .graph-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(260px, 1fr));
        gap: 18px;
        margin: 18px 0 20px;
      }

      .graph-card {
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px 14px 10px;
      }

      .graph-card h3 {
        margin: 0 0 8px;
        font-size: 1rem;
      }

      .graph-card svg {
        width: 100%;
        height: 170px;
        display: block;
        background: rgba(9, 18, 29, 0.6);
        border-radius: 10px;
      }

      .grid {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 20px;
        margin-top: 18px;
      }

      .network-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .network-card {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        text-align: left;
        background: var(--panel-alt);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 16px;
      }

      .network-main {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .network-name {
        font-weight: 700;
      }

      .network-meta {
        font-size: 0.8rem;
        color: var(--muted);
      }

      .network-signal {
        font-size: 1.1rem;
        letter-spacing: 0.12rem;
        color: var(--success);
      }

      .empty-state {
        border: 1px dashed var(--border);
        border-radius: 12px;
        color: var(--muted);
        padding: 20px;
        text-align: center;
      }

      .form-panel {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 0.9rem;
        color: var(--muted);
      }

      input {
        background: #0d1a2b;
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        padding: 12px 14px;
        font-size: 1rem;
      }

      .message {
        min-height: 24px;
        font-size: 0.95rem;
        color: var(--success);
      }

      .message.error {
        color: var(--error);
      }

      @media (max-width: 720px) {
        .grid,
        .graph-grid,
        .stats-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="panel">
        <h1>Pi-Proxy</h1>

        <div class="toolbar">
          <div class="button-row">
            <button id="refreshBtn" type="button">Refresh networks</button>
            <button id="hotspotBtn" class="secondary" type="button">Start hotspot</button>
          </div>
        </div>

        <div id="status" class="status">Loading network status...</div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">Connection speed</div>
            <div id="speedValue" class="stat-value">0.0 Mbps</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Connected devices</div>
            <div id="connectedValue" class="stat-value">0</div>
          </div>
        </div>

        <div class="graph-grid">
          <div class="graph-card">
            <h3>Live connection speed</h3>
            <svg id="speedChart" viewBox="0 0 420 160" preserveAspectRatio="none"></svg>
          </div>
          <div class="graph-card">
            <h3>Connected devices</h3>
            <svg id="deviceChart" viewBox="0 0 420 160" preserveAspectRatio="none"></svg>
          </div>
        </div>

        <div class="grid">
          <div>
            <h2>Available Wi‑Fi</h2>
            <div id="networks" class="network-list"></div>
          </div>

          <div class="form-panel">
            <h2>Connect to a network</h2>
            <form id="connectForm">
              <label>
                SSID
                <input id="ssid" type="text" placeholder="My Wi‑Fi" />
              </label>
              <label>
                Password
                <input id="password" type="password" placeholder="Optional for open networks" />
              </label>
              <button type="submit">Connect</button>
            </form>
            <div id="message" class="message" aria-live="polite"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="/frontend.js"></script>
  </body>
</html>
